services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.2}
    restart: unless-stopped
    ipc: host
    gpus: all
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-restaurant-assistant}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-hermes}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm_model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 120s

volumes:
  vllm_model_cache:
