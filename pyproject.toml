[project]
name = "mysmartfood-voice"
version = "0.2.0"
description = "Voice Service FastAPI : Twilio Media Streams, VAD, STT, LLM, TTS. Le metier reste dans Fastify."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "numpy>=2.0",
  "onnxruntime>=1.19",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.4",
]
livekit = [
  "livekit-agents[openai,silero]>=1.8",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
voice-api = "app.main:run"
voice-preflight = "app.preflight:run"
voice-livekit = "livekit_agent.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "livekit_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
